[project]
name = "ehds-backend"
version = "0.1.0"
description = "EHDS Health Data Access Body prototype (Regulation (EU) 2025/327)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyyaml",
    "pillow>=12,<13",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# Local NLI model for the purpose check. Install the CPU build of torch first:
#   .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
nli = ["torch", "transformers", "sentencepiece", "protobuf"]

[tool.setuptools.packages.find]
include = ["app*"]  # backend/spe/ holds runtime data, not a package

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
