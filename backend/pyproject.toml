[project]
name = "ehds-backend"
version = "0.1.0"
description = "EHDS Health Data Access Body prototype (Regulation (EU) 2025/327)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pillow>=12,<13",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]  # backend/spe/ holds runtime data, not a package

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
