# Purpose check for Regulation (EU) 2025/327, Chapter IV.
#
# Statements paraphrase the article points in general terms. They must not be
# tuned to individual test requests (see scripts/evaluate.py for the protocol).
# The point texts are paraphrased from memory: EUR-Lex could not be fetched
# automatically. Check them against https://eur-lex.europa.eu/eli/reg/2025/327/oj/eng.

# Engines in order; the first one that is available and answers decides.
# llm = IBM Bob (cloud, request text only), nli = local model, rules = phrases only.
engines: [llm, nli, rules]

llm:
  command: bob            # IBM Bob Shell (npm @ibm/bob), needs BOB_API_KEY
  timeout_seconds: 60

# Multilingual zero-shot NLI model (~1.2 GB, MIT licence), downloaded once from Hugging Face.
# Chosen on requests/R01-R10: mDeBERTa-v3-base-xnli was faster but confused purposes,
# 8-bit quantisation degraded both models without a speed gain.
model: MoritzLaurer/bge-m3-zeroshot-v2.0

# Calibrated on requests/R01-R10 only: approved samples score <= 0.09 on every
# prohibited point (R05 0.66 on re-identification, but 0.95 on an allowed purpose);
# rejected samples 0.60-0.88. SPE justification: R05 0.94, R09 0.05.
thresholds:
  # A prohibited point applies if its best statement scores at least `reject`,
  # or at least `review` and higher than every allowed purpose (then flagged).
  reject: 0.80
  review: 0.50
  allowed: 0.50          # an allowed purpose is recognised from this score
  spe: 0.50              # the applicant justifies patient-level data

# Art. 54(1): prohibited secondary use.
prohibited:
  - point: "54(1)(a)"
    label: "decisions that harm people"
    statements:
      - "The applicant will use the health data to take decisions that harm people or put them at a disadvantage."
  - point: "54(1)(b)"
    label: "insurance, employment, credit or worse terms"
    statements:
      - "The applicant will use the health data to set insurance premiums or insurance conditions, or to exclude people from insurance."
      - "The applicant will use the health data to decide about hiring or employing people."
      - "The applicant will use the health data to set loan or credit conditions or to offer people worse terms for goods or services."
  - point: "54(1)(c)"
    label: "advertising or marketing"
    statements:
      - "The applicant will use the health data for advertising or marketing."
  - point: "54(1)(d)"
    label: "developing harmful products"
    statements:
      - "The applicant develops products that harm health, such as tobacco, nicotine, alcohol, illicit drugs or weapons."
      - "The applicant develops a product designed to make people addicted."
  - point: "54(1)(e)"
    label: "conflict with ethical principles"
    statements:
      - "The applicant's purpose conflicts with ethical principles."
  - point: "re-identification"
    label: "re-identifying people"
    statements:
      - "The applicant wants to identify individual persons in the data."

# Art. 53(1): allowed purposes (exhaustive list).
allowed:
  - point: "53(1)(a)"
    label: "public or occupational health"
    statements:
      - "The purpose is public health or occupational health, such as disease prevention or surveillance."
  - point: "53(1)(b)"
    label: "policy-making and regulation"
    statements:
      - "The purpose is to support health policy-making or regulation by public authorities."
  - point: "53(1)(c)"
    label: "official statistics"
    statements:
      - "The purpose is official statistics."
  - point: "53(1)(d)"
    label: "education and teaching"
    statements:
      - "The purpose is education or teaching in health or care."
  - point: "53(1)(e)"
    label: "scientific research"
    statements:
      - "The purpose is scientific research in health or care."
      - "The purpose is to develop, train, test or evaluate algorithms, AI systems or health products."
  - point: "53(1)(f)"
    label: "improving care"
    statements:
      - "The purpose is to improve the delivery of care or the treatment of patients."

# Step 3 of the decision order: an access application explains why statistics are not enough.
spe_justification:
  label: "patient-level data is justified"
  statements:
    - "The applicant explains why aggregated statistics are not enough for the analysis."
    - "The analysis needs the data of each individual patient, not summary tables."

# Used when the model is not installed, and as a floor that always applies.
# Only unambiguous phrases; anything subtle is left to the model.
rules:
  prohibited:
    - point: "54(1)(b)"
      any_of: ['\binsurance premiums?\b.{0,40}\b(risk|pric\w*)\b', '\b(align|set|adjust)\w* .{0,40}\binsurance premiums?\b']
    - point: "54(1)(b)"
      any_of: ['\bemployee list\b']
    - point: "54(1)(c)"
      any_of: ['\badvertising campaign\b', '\bmarketing campaign\b']
    - point: "54(1)(d)"
      any_of: ['\b(tobacco|nicotine)\b.{0,40}\b(product|flavour|brand)s?\b', '\b(develop|launch)\w* .{0,40}\b(tobacco|nicotine|alcoholic)\b']
  spe_justification:
    any_of:
      - '\b(aggregates?|statistics|summary tables?) (are|is) (not enough|insufficient|not sufficient)\b'
      - '\b(individual|patient|person|record)[- ]level\b'
      - '\b(train|validat)\w* .{0,30}\b(model|algorithm)s?\b'

reasons:
  reject: "This purpose is prohibited: {labels} (Art. 54)."
  allowed: "{labels} {verb} (Art. 53)."
  no_allowed_purpose: "No allowed purpose under Art. 53 was recognised automatically; staff must confirm it."
  statistical: "Statistics answer the question (Art. 69)."
  spe: "The applicant explains why statistics are not enough, so pseudonymised data is justified (Art. 66). Access only under a data permit inside a secure processing environment (Art. 68, 73)."
  downgrade: "Statistics answer the question, so pseudonymised records are not justified (Art. 66). Approved as statistics instead (Art. 69)."
