<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/></marker>
  </defs>
  <rect width="1200" height="440" fill="#ffffff"/>

  <!-- request -->
  <rect x="40" y="150" width="230" height="140" rx="14" fill="#f6f7f9" stroke="#c9d0d9" stroke-width="2"/>
  <text x="155" y="200" font-size="22" font-weight="700" fill="#1f2a37" text-anchor="middle">Request</text>
  <text x="155" y="232" font-size="15" fill="#5b6472" text-anchor="middle">plain English</text>
  <text x="155" y="256" font-size="15" fill="#5b6472" text-anchor="middle">who · why · what</text>

  <line x1="270" y1="220" x2="332" y2="220" stroke="#5b6472" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- law check -->
  <rect x="336" y="150" width="260" height="140" rx="14" fill="#fff8e6" stroke="#f0b429" stroke-width="2.5"/>
  <text x="466" y="200" font-size="22" font-weight="700" fill="#7a4f00" text-anchor="middle">Law check</text>
  <text x="466" y="232" font-size="15" fill="#7a4f00" text-anchor="middle">AI picks the rule from the law</text>
  <text x="466" y="256" font-size="15" fill="#7a4f00" text-anchor="middle">and quotes it</text>

  <!-- branches -->
  <line x1="596" y1="190" x2="690" y2="90" stroke="#c62828" stroke-width="2.5" marker-end="url(#r)"/>
  <line x1="596" y1="220" x2="690" y2="220" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="596" y1="250" x2="690" y2="350" stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)"/>

  <!-- outcomes -->
  <rect x="694" y="40" width="466" height="100" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2.5"/>
  <text x="720" y="82" font-size="22" font-weight="700" fill="#8e1b1b">Rejected</text>
  <text x="720" y="112" font-size="15" fill="#8e1b1b">Prohibited use, e.g. insurance pricing · Art. 54</text>

  <rect x="694" y="170" width="466" height="100" rx="14" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="720" y="212" font-size="22" font-weight="700" fill="#1b5e20">Anonymised statistics</text>
  <text x="720" y="242" font-size="15" fill="#1b5e20">Small groups hidden, opt-outs excluded · Art. 53, 69</text>

  <rect x="694" y="300" width="466" height="100" rx="14" fill="#e8f1fb" stroke="#1565c0" stroke-width="2.5"/>
  <text x="720" y="342" font-size="22" font-weight="700" fill="#0d3c78">Records in a secure room</text>
  <text x="720" y="372" font-size="15" fill="#0d3c78">View and query inside, no download · Art. 66, 68, 73</text>

  <!-- footer -->
  <text x="40" y="412" font-size="14" fill="#8a94a3">Patient data never leaves the app. The AI only ever sees the request and the law.</text>
</svg>
