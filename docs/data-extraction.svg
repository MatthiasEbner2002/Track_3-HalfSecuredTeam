<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-bob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Data extraction: from request text to numbers</text>
  <text x="40" y="80" font-size="15" fill="#64748b">mapping + query layers, after the request is approved · patient data never leaves SQLite</text>

  <!-- 1 request -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="180" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <text x="58" y="160" font-size="16" font-weight="700" fill="#0f172a">Approved request</text>
  <text x="58" y="188" font-size="13" fill="#334155">definitions</text>
  <text x="58" y="208" font-size="13" fill="#334155">question</text>
  <text x="58" y="228" font-size="13" fill="#334155">“Report per region:</text>
  <text x="58" y="246" font-size="13" fill="#334155">  adults, % with …”</text>
  <text x="58" y="268" font-size="12" fill="#94a3b8">free English</text>

  <!-- 2 rule parser -->
  <g filter="url(#shadow)">
    <rect x="270" y="130" width="190" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <circle cx="292" cy="156" r="12" fill="#3b82f6"/>
  <text x="292" y="161" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="312" y="161" font-size="16" font-weight="700" fill="#1e3a8a">Rule parser</text>
  <text x="288" y="190" font-size="13" fill="#1e40af">regex must match the</text>
  <text x="288" y="208" font-size="13" fill="#1e40af">whole sentence</text>
  <text x="288" y="232" font-size="13" fill="#1e40af">finds defined names in</text>
  <text x="288" y="250" font-size="13" fill="#1e40af">the report line</text>
  <text x="288" y="270" font-size="12" fill="#60a5fa">fast · free · 83 / 100</text>

  <!-- QuerySpec contract -->
  <g filter="url(#shadow)">
    <rect x="510" y="112" width="200" height="186" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <text x="610" y="142" font-size="18" font-weight="700" fill="#78350f" text-anchor="middle">QuerySpec</text>
  <text x="610" y="160" font-size="12" fill="#b45309" text-anchor="middle">the contract (pydantic)</text>
  <line x1="530" y1="172" x2="690" y2="172" stroke="#fcd34d"/>
  <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="13" fill="#92400e">
    <text x="532" y="194">concepts</text>
    <text x="532" y="213">cohort</text>
    <text x="532" y="232">group_by · bands</text>
    <text x="532" y="251">metrics</text>
    <text x="532" y="270">record_types</text>
  </g>
  <text x="610" y="290" font-size="11" fill="#b45309" text-anchor="middle">same format from rules or Bob</text>

  <!-- 3 compiler -->
  <g filter="url(#shadow)">
    <rect x="760" y="130" width="180" height="150" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  </g>
  <circle cx="782" cy="156" r="12" fill="#14b8a6"/>
  <text x="782" y="161" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="802" y="161" font-size="16" font-weight="700" fill="#134e4a">SQL compiler</text>
  <text x="778" y="190" font-size="13" fill="#115e59">one patient-ID CTE</text>
  <text x="778" y="208" font-size="13" fill="#115e59">per concept</text>
  <text x="778" y="232" font-size="13" fill="#115e59">fixed column bindings,</text>
  <text x="778" y="250" font-size="13" fill="#115e59">opt-outs always excluded</text>
  <text x="778" y="270" font-size="12" fill="#2dd4bf">runs on SQLite</text>

  <!-- 4 answer -->
  <g filter="url(#shadow)">
    <rect x="990" y="130" width="170" height="150" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  </g>
  <circle cx="1012" cy="156" r="12" fill="#22c55e"/>
  <text x="1012" y="161" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="1032" y="161" font-size="16" font-weight="700" fill="#14532d">Answer</text>
  <text x="1008" y="190" font-size="13" fill="#166534">% and means in</text>
  <text x="1008" y="208" font-size="13" fill="#166534">Python, half up</text>
  <text x="1008" y="232" font-size="13" fill="#166534">small cells → “&lt;10”,</text>
  <text x="1008" y="250" font-size="13" fill="#166534">“suppressed”</text>
  <text x="1008" y="270" font-size="12" fill="#4ade80">every group listed</text>

  <!-- main arrows -->
  <line x1="220" y1="205" x2="266" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="205" x2="506" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="205" x2="756" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="205" x2="986" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 Bob -->
  <path d="M365,280 L365,368" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-bob)"/>
  <rect x="373" y="306" width="132" height="40" rx="6" fill="#ffffff"/>
  <text x="381" y="322" font-size="12" fill="#6d28d9">a sentence the</text>
  <text x="381" y="339" font-size="12" fill="#6d28d9">rules can't read</text>

  <g filter="url(#shadow)">
    <rect x="270" y="372" width="190" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <circle cx="292" cy="398" r="12" fill="#7c3aed"/>
  <text x="292" y="403" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="312" y="403" font-size="16" font-weight="700" fill="#4c1d95">IBM Bob</text>
  <text x="288" y="432" font-size="13" fill="#5b21b6">sees request text only,</text>
  <text x="288" y="450" font-size="13" fill="#5b21b6">never patient data</text>
  <text x="288" y="474" font-size="13" fill="#5b21b6">answers cached:</text>
  <text x="288" y="492" font-size="13" fill="#5b21b6">same input, same result</text>
  <text x="288" y="512" font-size="12" fill="#a78bfa">~5–20 s · 100 / 100</text>

  <path d="M460,430 L560,430 L560,302" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-bob)"/>
  <text x="550" y="420" font-size="12" fill="#6d28d9" text-anchor="end">same QuerySpec</text>

  <!-- checks -->
  <g filter="url(#shadow)">
    <rect x="600" y="340" width="300" height="182" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="620" y="368" font-size="15" font-weight="700" fill="#0f172a">Checks before any SQL runs</text>
  <g font-size="13" fill="#334155">
    <text x="620" y="396">✓  fits the QuerySpec schema</text>
    <text x="620" y="420">✓  a mean only of a measurement</text>
    <text x="620" y="444">✓  every code exists in the data</text>
    <text x="620" y="468">✓  Bob: codes must be in the request</text>
    <text x="620" y="492">✓  Bob: one retry, then stop</text>
  </g>
  <text x="620" y="512" font-size="12" fill="#94a3b8">flag “llm_interpreted” for staff</text>
  <line x1="650" y1="340" x2="650" y2="302" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- stop -->
  <path d="M270,470 L222,470" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-stop)"/>
  <g filter="url(#shadow)">
    <rect x="40" y="400" width="180" height="122" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <text x="58" y="430" font-size="16" font-weight="700" fill="#334155">Stop, loudly</text>
  <text x="58" y="456" font-size="13" fill="#475569">“could not interpret:</text>
  <text x="58" y="474" font-size="13" fill="#475569"> &lt;sentence&gt;”</text>
  <text x="58" y="498" font-size="13" fill="#475569">→ staff review,</text>
  <text x="58" y="514" font-size="13" fill="#475569">never a guess</text>

  <!-- example strip -->
  <text x="40" y="582" font-size="16" font-weight="700" fill="#0f172a">One sentence through all four steps (R09)</text>
  <g font-size="13">
    <rect x="40" y="600" width="260" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="56" y="626" font-size="12" font-weight="700" fill="#64748b">REQUEST</text>
    <text x="56" y="652" fill="#0f172a">“ARB = ATC code starting</text>
    <text x="56" y="671" fill="#0f172a"> with C09CA”</text>
    <text x="56" y="697" fill="#0f172a">“… % with an active ARB”</text>

    <rect x="320" y="600" width="250" height="120" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="336" y="626" font-size="12" font-weight="700" fill="#b45309">QUERYSPEC</text>
    <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12" fill="#92400e">
      <text x="336" y="652">kind: drug</text>
      <text x="336" y="671">codes: [C09CA]</text>
      <text x="336" y="690">active: true</text>
      <text x="336" y="709">op: percent of subject</text>
    </g>

    <rect x="590" y="600" width="320" height="120" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="606" y="626" font-size="12" font-weight="700" fill="#0f766e">SQL</text>
    <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12" fill="#115e59">
      <text x="606" y="652">s5 AS (SELECT patient_id</text>
      <text x="606" y="671">  FROM medications WHERE</text>
      <text x="606" y="690">  atc LIKE 'C09CA%' AND</text>
      <text x="606" y="709">  active on 2025-12-31)</text>
    </g>

    <rect x="930" y="600" width="230" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="946" y="626" font-size="12" font-weight="700" fill="#15803d">ANSWER</text>
    <text x="946" y="652" fill="#14532d">18-49 · 359 · 33.4 %</text>
    <text x="946" y="675" fill="#14532d">50-64 · 1057 · 32.4 %</text>
    <text x="946" y="698" fill="#14532d">65+ · 2046 · 33.2 %</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="300" y1="660" x2="316" y2="660" marker-end="url(#arrow)"/>
    <line x1="570" y1="660" x2="586" y2="660" marker-end="url(#arrow)"/>
    <line x1="910" y1="660" x2="926" y2="660" marker-end="url(#arrow)"/>
  </g>

  <!-- footer -->
  <text x="40" y="768" font-size="13" fill="#64748b">Black-box test, 100 requests written by a separate agent: 83 / 100 with rules only · 100 / 100 with Bob · samples R01, R03, R05, R07–R09 match expected.json</text>
</svg>
